width: 384
height: 288
shift_x: 0
shift_y: 0
roi_margin_x: 30
roi_margin_y: 20
threshold_k: 2.0
min_area: 20
max_area: 5000
max_candidates: 1
# 候选区域相对周围 10 像素背景的最低灰度差，过滤墙面和柜体的弱亮斑。
min_local_contrast: 10.0
# 比赛热源可能位于视野边缘；保留 border 状态用于调试，但不禁止确认。
reject_roi_border_touching: false
publish_rate: 20
display: false
uvc_demo_path: "uvc_demo"
uvc_offset_fix: 0
candidate_detected_topic: "/UAV0/thermal/target_candidate_detected"
candidate_status_topic: "/UAV0/thermal/target_candidate_status"
candidate_pixel_topic: "/UAV0/thermal/target_candidate_pixel"

stable_filter_enable: true
stable_max_len: 3
stable_min_hits: 2
stable_max_pixel_jump: 25
