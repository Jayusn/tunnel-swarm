thermal_target_detected_topic: /UAV0/thermal/target_detected
thermal_target_pixel_topic: /UAV0/thermal/target_pixel
thermal_candidate_detected_topic: /UAV0/thermal/target_candidate_detected
thermal_candidate_pixel_topic: /UAV0/thermal/target_candidate_pixel
thermal_candidate_status_topic: /UAV0/thermal/target_candidate_status
thermal_candidate_camera_point_topic: /UAV0/thermal/target_candidate_camera_point
report_candidate_topic: ''
thermal_width: 384
thermal_height: 288
uvc_offset_fix: 0
shift_x: 0
shift_y: 0
roi_margin_x: 30
roi_margin_y: 20
d435_camera_info_topic: /camera/color/camera_info
d435_depth_topic: /camera/aligned_depth_to_color/image_raw
d435_color_topic: /camera/color/image_raw
d435_debug_image_topic: /UAV0/thermal/d435_debug_image
d435_exposure_warmup_seconds: 5.0
# 等热成像帧时间过去 0.40 秒后再融合，让迟到的 D455 图像进入缓存。
# 不修改原始时间戳；0 恢复立即融合。检测持续运行，融合显示/上报相应延迟。
fusion_delay_s: 0.40
# 彩色/深度各缓存的帧数，按原始热成像时间选择最近帧。
d435_image_cache_size: 20
# 热成像检测帧与深度帧允许的最大时间差（秒），超过时仅保留预览、不使用该深度定位。
depth_match_tolerance_s: 0.50
# 接收批次最多保留 5 帧，避免 queue_size=1 在短暂积压时只留下最新帧。
# 回调只缓存原始消息，选中后才转换图像；不是额外的融合等待时间。
d435_image_queue_size: 5
# rospy 大图像接收缓冲（字节）；1280x720 RGB8 的 5 帧约 13.8 MB。
d435_image_buff_size: 16777216
thermal_to_d435_homography:
- - 2.632295209442165
  - 0.032025874429704726
  - 171.96421616867903
- - 0.014070393650832572
  - 2.5282800372093774
  - -103.50726448996645
- - 8.782670925477653e-05
  - -3.817835571678216e-06
  - 1.0
depth_scale: 0.001
depth_search_radius: 5
min_valid_depth: 0.2
max_valid_depth: 5.0
target_frame: odom
d435_optical_frame: camera_color_optical_frame
use_tf: true
publish_rate: 20
debug: true
