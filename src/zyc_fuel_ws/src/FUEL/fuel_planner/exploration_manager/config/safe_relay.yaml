# 实飞一次即可入选；map_confirmations 是地图更新次数，不是停留或往返次数。
mission:
  safe_relay:
    enabled: false  # 双机 UAV0 入口显式开启，其他入口保持原任务行为。
    frame_id: world
    normal_spacing: 1.00
    minimum_progress: 0.70
    minimum_xy_spacing: 0.70  # 后续三类点统一与上一已发点比较 XY 直线距离；首点豁免。
    entrance_minimum_progress: 0.50  # 尚未发布任何点时，相对实测入口样本的最低累计前进量。
    release_distance: 1.00
    selection_window: 0.50
    sample_spacing: 0.08
    # 只检查新点自身的停留包络；已发点不撤回，连接路径由后机规划。
    hold_radius: 0.30
    hold_half_height: 0.10
    map_confirmations: 2
    map_timeout: 1.00
    odom_timeout: 0.50
    dynamic_wait_horizon: 2.00
    maximum_samples: 10000
