# 实飞一次即可入选；map_confirmations 是地图更新次数，不是停留或往返次数。
mission:
  safe_relay:
    enabled: false  # 双机 UAV0 入口显式开启，其他入口保持原任务行为。
    frame_id: world
    normal_spacing: 1.00
    minimum_progress: 0.50
    release_distance: 1.00
    selection_window: 0.50
    sample_spacing: 0.08
    # 沿用现有静态通行包络 0.18/0.10m，并覆盖后机到点容差 0.25/0.20m 和 0.02m 余量。
    hold_radius: 0.45
    hold_half_height: 0.32
    transit_radius: 0.18
    transit_half_height: 0.10
    map_confirmations: 2
    map_timeout: 1.00
    odom_timeout: 0.50
    maximum_sample_gap: 0.50
    dynamic_wait_horizon: 2.00
    maximum_samples: 10000
    # 每轮给点中，历史连接受阻后的 A* 搜索共享此墙钟预算。
    replan_time_budget: 0.05
