# 修改后重启前机规划器生效。false 为原有自动路径，true 为手填途径点备用路线。
mission:
  manual_path:
    enabled: false
    # 实际里程计进入此三维距离内后，切换到下一个点，单位米。
    arrive_distance: 0.25
    # 前机 FAST-LIO 世界坐标（通常为 UAV0/camera_init），单位米，按列表顺序使用。
    # 只填写中间点，当前位置和自动选择的前沿目标不需要填写。
    # 示例（请按实际场地替换后取消注释）：
    # waypoints:
    #   - [1.0, 1.5, 0.8]
    #   - [1.0, 3.0, 0.8]
    #   - [2.5, 3.0, 0.8]
    waypoints: []
