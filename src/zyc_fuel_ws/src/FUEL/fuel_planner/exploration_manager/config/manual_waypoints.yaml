# 仅供 uav0_manual_waypoints.launch 加载，修改后重启该规划器生效。
mission:
  manual_path:
    # 实际里程计进入此三维距离内后，切换到下一个点，单位米。
    arrive_distance: 0.25
    # 前机 FAST-LIO 世界坐标（通常为 UAV0/camera_init），单位米，按列表顺序使用。
    # 填写全部航点，包括最终终点，不填写当前位置；不再追加任何前沿目标。
    # 将下面的 waypoints: [] 整行替换为实际列表，例如：
    # waypoints:
    #   - [1.0, 1.5, 0.8]
    #   - [1.0, 3.0, 0.8]
    #   - [2.5, 3.0, 0.8]
    waypoints: []
