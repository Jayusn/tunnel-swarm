# 正式 FUEL 入口和出口独立测试共用的建图参数。
# 地图尺寸、搜索边界、射线距离和世界坐标系由各入口传入。
sdf_map:
  resolution: 0.05
  obstacles_inflation: 0.099
  local_bound_inflate: 0.5
  local_map_margin: 100
  ground_height: -1.0
  default_dist: 0.0
  p_hit: 0.65
  p_miss: 0.35
  p_min: 0.12
  p_max: 0.90
  p_occ: 0.80
  # 原始概率占据保留；孤立噪点不直接进入规划膨胀层。
  inflation_noise_filter_enabled: true
  # 命中达标仍需至少一个当前邻格；不达标时要求下面配置数量的邻格。
  # 有效FREE射线使命中证据递减，盲区无回波不作为FREE证据。
  inflation_min_hit_evidence: 2
  inflation_min_neighbors: 2
  inflation_neighbor_radius: 0.10
  inflation_vertical_radius: 4
  min_ray_length: 0.5
  virtual_ceil_height: -10.0
  optimistic: false
  signed_dist: false
  # 正式入口可通过 retain_global_static_cloud 覆盖。
  static_retention_enabled: false
  static_retention_required_hits: 6
map_ros:
  # 与FAST_LIO/config/mid360.yaml的盲区和IMU-LiDAR平移一致；仅用于点云射线融合。
  # 不改变雷达滤点，也不把25cm无回波区域当作可通行证据。
  lidar_blind_radius: 0.25
  lidar_offset_x: -0.011
  lidar_offset_y: -0.02329
  lidar_offset_z: 0.04412
  depth_filter_mindist: 0.2
  depth_filter_margin: 2
  k_depth_scaling_factor: 1000.0
  skip_pixel: 2
  esdf_slice_height: 0.3
  visualization_truncate_height: 10.09
  visualization_truncate_low: -2.0
  show_occ_time: false
  show_esdf_time: false
  show_all_map: true
