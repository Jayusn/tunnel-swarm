subscribers:
  camera_reading:
    img_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
yolo:
  model_reading:
    model_path: model/crack1_20261019_162821.bin
    para_path: model/crack1_20261019_162821.param
    class_names: ["crack"]
    anchors: [40.7, 33.55, 29.7, 81.4, 111.1, 35.2, 300.02, 36.58, 61.13, 180.51, 139.15, 102.3]
  detection_parameters:
    use_gpu: false
    input_size: 352
    nmsThresh: 0.25
    confThresh: 0.70
    # whole: full frame; sliced: overlapping tiles; hybrid: both, duplicate suppression.
    mode: hybrid
    tile_size: 512
    tile_overlap: 0.25
    global_nms: 0.25
    max_tiles: 256
