# 桥坐标：x 沿桥洞入口到出口，y 向左，z 相对桥洞底板；单位 m。
# bridge.launch 把这些点转换到同一 FAST-LIO 坐标系。
# 0.50 是可修改的初始飞行高度，不是已完成现场验证的高度。
# 每行 [x, y, z, 到点停留秒数]；检测结果不参与航点切换。
waypoints:
  - [-1.0, 0.0, 0.50, 0.0]
  - [0.5, 0.0, 0.50, 0.0]
  - [3.0, 0.0, 0.50, 0.0]
  - [6.0, 0.0, 0.50, 0.0]
  - [9.8, 0.0, 0.50, 0.0]
  - [11.3, 0.0, 0.50, 0.0]
# 出洞后追加 launch 指定的车上方航点，再触发 18 cm 精降。
arrival_distance_m: 0.15
arrival_speed_mps: 0.15
