# 每行 [x, y, z, 保持秒数, 到点转向角度]，XYZ 使用 FAST-LIO 的 UAV1/camera_init 坐标，单位 m。
# 第五项可省略；负数右转、正数左转，相对该点原航向，单位度。
# 有转向时：到点悬停后转向，转到目标航向后保持，再转回原航向才继续下一点。
# 第四项可省略或填 0，表示到点后立即发下一点；例如 [3.0, 0.0, 1.8, 3.0] 保持 3 秒。
# 满足下方距离和速度条件后开始计时，期间保持当前目标；到时且满足到点条件再发下一点。
# 不叠加入口位置或底板高度，不旋转坐标。
# 以下为待按现场实测修改的示例坐标，不再表示距桥洞入口的距离。
# 2026-11-07：按 10:54:40 航点在通道内的分布，对齐到 17:05:52 的点云坐标。
# 坐标基于本次点云；第2、3点同Y，第4、5点同Y，第6点前移0.60m。
# 第1点 Y=1.07，第2、3点 Y=0.97；第4、5点 Y=1.53，对齐中间障碍旁净空中线。
# 保留新增的原起点接近点；Z=1.58 对应 ground_z=-0.22 上方 1.80 m。
waypoints:
  - [4.60, 1.07, 1.58]  # 入口接近点
  - [6.45, 0.97, 1.58, 3.0, -90.0]  # 再向右10cm拍摄裂缝；右转90度、保持3秒、转回后继续
  - [8.60, 0.97, 1.58, 1.0]  # 与第2点对齐；到点保持1秒观察二维码
  - [9.10, 1.53, 1.58]  # 中间障碍旁净空中线
  - [11.10, 1.53, 1.58]  # 与第4点对齐，沿中间障碍旁净空中线通过
  - [13.00, 1.10, 1.58]  # 向第5点靠近0.60m，位于出口侧障旁
  - [16.00, 1.10, 1.58]  # 出桥：延续桥梁中线
# 出洞后追加 launch 指定的车上方航点，再触发 18 cm 精降。
arrival_distance_m: 0.15
arrival_speed_mps: 0.15
