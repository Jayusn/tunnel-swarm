# 每行 [x, y, z]，直接使用 FAST-LIO 的 UAV1/camera_init 坐标，单位 m。
# 不叠加入口位置或底板高度，不旋转坐标；满足到点条件后立即发下一点。
# 以下为待按现场实测修改的示例坐标，不再表示距桥洞入口的距离。
# z=2.0 是地图 Z；只有 ground_z=0 时才等于离地 2 m。
waypoints:
  - [-1.0, 0.0, 2.0]
  - [0.5, 0.0, 2.0]
  - [3.0, 0.0, 2.0]
  - [6.0, 0.0, 2.0]
  - [9.8, 0.0, 2.0]
  - [11.3, 0.0, 2.0]
# 出洞后追加 launch 指定的车上方航点，再触发 18 cm 精降。
arrival_distance_m: 0.15
arrival_speed_mps: 0.15
