# 仅供 run_exp_single_fuel_waypoints.launch 使用，修改后重启该规划器。
# 坐标为 /UAV0/fast_lio/Odom_high_freq 所在世界系（UAV0/camera_init），单位米。
# 这是绝对 XYZ，不是机体系位移；z 也不是相对当前高度。
mission:
  manual_path:
    # 实际里程计进入三维距离阈值才切换到下一个点。
    arrive_distance: 0.25
    # 按顺序填写全部航点，最后一项是终点；不需要重复填写当前位置。
    # 将 waypoints: [] 替换成自己的路线，例如（仅示例，不会自动执行）：
    # waypoints:
    #   - [1.0, 0.0, 0.8]
    #   - [1.0, 2.0, 0.8]
    #   - [3.0, 2.0, 0.8]
    # 空列表不产生飞行目标。障碍间的连通路线由 FUEL A* + B 样条规划。
    waypoints: []
