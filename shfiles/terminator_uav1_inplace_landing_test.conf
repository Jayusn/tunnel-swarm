[global_config]
  suppress_multiple_term_dialog = True
[keybindings]
[profiles]
  [[default]]
[layouts]
  [[uav1_inplace_landing_test]]
    [[[window0]]]
      type = Window
      parent = ""
      title = UAV1 原地起飞精降测试
      size = 1920,1080
      maximised = True
    [[[root]]]
      type = VPaned
      parent = window0
      ratio = 0.5
    [[[top]]]
      type = HPaned
      parent = root
      ratio = 0.333
    [[[mavros]]]
      type = Terminal
      parent = top
      profile = default
      title = 1 MAVROS
      command = __UAV1_INPLACE_TEST_SCRIPT__ --pane mavros
    [[[top_right]]]
      type = HPaned
      parent = top
      ratio = 0.5
    [[[mid360]]]
      type = Terminal
      parent = top_right
      profile = default
      title = 2 MID360
      command = __UAV1_INPLACE_TEST_SCRIPT__ --pane mid360
    [[[fastlio]]]
      type = Terminal
      parent = top_right
      profile = default
      title = 3 FAST-LIO
      command = __UAV1_INPLACE_TEST_SCRIPT__ --pane fastlio
    [[[bottom]]]
      type = HPaned
      parent = root
      ratio = 0.333
    [[[pose]]]
      type = Terminal
      parent = bottom
      profile = default
      title = 4 位姿回传
      command = __UAV1_INPLACE_TEST_SCRIPT__ --pane pose
    [[[bottom_right]]]
      type = HPaned
      parent = bottom
      ratio = 0.5
    [[[landing]]]
      type = Terminal
      parent = bottom_right
      profile = default
      title = 5 起飞与精降待命
      command = __UAV1_INPLACE_TEST_SCRIPT__ --pane landing
    [[[monitor]]]
      type = Terminal
      parent = bottom_right
      profile = default
      title = 6 下视精降画面
      command = __UAV1_INPLACE_TEST_SCRIPT__ --pane image
[plugins]
