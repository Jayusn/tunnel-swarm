[global_config]
  suppress_multiple_term_dialog = True
[profiles]
  [[default]]
[layouts]
  [[uav1_four_view]]
    [[[window0]]]
      type = Window
      parent = ""
      title = UAV1 单机检测四分屏
      size = 1920,1080
      maximised = True
    [[[root]]]
      type = VPaned
      parent = window0
      ratio = 0.5
    [[[top]]]
      type = HPaned
      parent = root
      ratio = 0.333
    [[[mavros]]]
      type = Terminal
      parent = top
      profile = default
      title = 1 UAV1 MAVROS
      command = __UAV1_FOUR_VIEW_SCRIPT__ --pane mavros
    [[[top_right]]]
      type = HPaned
      parent = top
      ratio = 0.5
    [[[mid360]]]
      type = Terminal
      parent = top_right
      profile = default
      title = 2 UAV1 MID360
      command = __UAV1_FOUR_VIEW_SCRIPT__ --pane mid360
    [[[fastlio]]]
      type = Terminal
      parent = top_right
      profile = default
      title = 3 UAV1 FAST-LIO
      command = __UAV1_FOUR_VIEW_SCRIPT__ --pane fastlio
    [[[bottom]]]
      type = HPaned
      parent = root
      ratio = 0.5
    [[[detection]]]
      type = Terminal
      parent = bottom
      profile = default
      title = 4 UAV1 检测与上报
      command = __UAV1_FOUR_VIEW_SCRIPT__ --pane detection
    [[[view]]]
      type = Terminal
      parent = bottom
      profile = default
      title = 5 UAV1 四分屏画面
      command = __UAV1_FOUR_VIEW_SCRIPT__ --pane view
[plugins]
