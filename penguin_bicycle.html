<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的骑行日记</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e8efea; color: #253f49; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1080px, 100%); padding: 28px; }
    .scene { position: relative; overflow: hidden; border: 1px solid #fff9; border-radius: 28px; background: #f5f5e9; box-shadow: 0 24px 80px #254c4520; }
    .caption { position: absolute; z-index: 1; top: 7%; left: 7%; pointer-events: none; }
    .eyebrow { margin: 0 0 12px; color: #64857e; font-size: 11px; letter-spacing: 4px; }
    h1 { margin: 0; font-size: clamp(22px, 4vw, 38px); font-weight: 600; letter-spacing: 3px; }
    .subtitle { margin: 14px 0 0; color: #64857e; font-size: clamp(11px, 1.6vw, 14px); letter-spacing: 2px; }
    svg { display: block; width: 100%; height: auto; }
    .cloud { animation: drift 28s linear infinite; }
    .cloud-slow { animation-duration: 42s; animation-delay: -17s; }
    .road { animation: road 1.8s linear infinite; }
    .plants { animation: landscape 9s linear infinite; }
    .scarf-tail { animation: flutter .65s ease-in-out infinite alternate; transform-origin: 511px 298px; }
    .rider { animation: bounce .9s ease-in-out infinite; }
    .blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drift { from { transform: translateX(180px); } to { transform: translateX(-1050px); } }
    @keyframes road { to { transform: translateX(-160px); } }
    @keyframes landscape { to { transform: translateX(-1000px); } }
    @keyframes flutter { from { transform: rotate(-5deg); } to { transform: rotate(8deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.1); } }
    footer { display: flex; justify-content: space-between; padding: 18px 5px 0; color: #718780; font-size: 11px; letter-spacing: 2px; }
    @media (max-width: 600px) { main { padding: 12px; } .scene { border-radius: 18px; } .eyebrow { font-size: 8px; letter-spacing: 2px; margin-bottom: 8px; } h1 { font-size: clamp(16px, 4vw, 22px); letter-spacing: 1px; } .subtitle { margin-top: 8px; letter-spacing: 1px; } footer { font-size: 9px; letter-spacing: 1px; } }
  </style>
</head>

  </main>
  <script>
    const get = id => document.getElementById(id);
    const wheels = document.querySelectorAll('.spokes');
    const crank = get('crank');
    const legs = ['far', 'near'].map(side => ({
      leg: get(`${side}-leg`), foot: get(`${side}-foot`), pedal: get(`${side}-pedal`)
    }));

    // Two connected leg segments follow opposite ends of the same crank.
    function drawLeg(parts, angle) {
      const hipX = 490, hipY = 389, thigh = 68, shin = 73;
      const x = 505 + 27 * Math.cos(angle), y = 500 + 27 * Math.sin(angle);
      const ankleY = y - 11;
      const dx = x - hipX, dy = ankleY - hipY, distance = Math.hypot(dx, dy);
      const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
      const kneeX = hipX + along * dx / distance + bend * dy / distance;
      const kneeY = hipY + along * dy / distance - bend * dx / distance;
      parts.leg.setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY}L${x} ${ankleY}`);
      parts.foot.setAttribute('transform', `translate(${x} ${y - 9})`);
      parts.pedal.setAttribute('d', `M${x - 17} ${y}H${x + 17}`);
      return { x, y };
    }

    function animate(time) {
      const angle = time * Math.PI * 2 / 1800;
      const far = drawLeg(legs[0], angle + Math.PI);
      const near = drawLeg(legs[1], angle);
      crank.setAttribute('d', `M${far.x} ${far.y}L${near.x} ${near.y}`);
      wheels.forEach(wheel => wheel.setAttribute('transform', `rotate(${time * 360 / 2400 % 360})`));
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
