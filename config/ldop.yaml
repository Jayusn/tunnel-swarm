input_cloud_topic: /cloud_registered
odom_topic: /Odometry
raw_cloud_output_topic: /ldop/raw_cloud
odom_output_topic: /ldop/odom
static_cloud_topic: /ldop/static_cloud
dynamic_cloud_topic: /ldop/dynamic_cloud
dynamic_objects_topic: /ldop/dynamic_objects
world_frame: camera_init  # 输入点云和里程计位姿统一使用的世界坐标系
verbose: false

ufomap_resolution: 0.3  # UFOMap 体素分辨率，单位米（更粗分辨率换取更高实时性）
ufomap_depth_levels: 16  # UFOMap 八叉树深度层数
ufomap_min_range: 0.5  # UFOMap 射线积分的最小距离
ufomap_max_range: 12.0  # UFOMap 最大射线长度，<=0 表示不限制
ufomap_insert_hit_depth: 0  # 命中点更新深度
ufomap_insert_miss_depth: 0  # 失配点更新深度
ufomap_ray_casting_depth: 0  # 射线投射深度，0 表示沿用 UFOMap 默认值
ufomap_num_threads: 4  # 并行插入线程数，0 表示沿用 UFOMap 默认值
ufomap_insert_only_valid: true  # 仅对有效射线区段执行插入
ufomap_inflate_unknown: 0  # DUFOMap 的 d_p，按邻域膨胀未知区域以容忍定位误差
ufomap_inflate_unknown_compensation: false  # 按 d_p 补偿射线末端未知膨胀
ufomap_ray_passthrough_hits: false  # DUFOMap 默认不让射线直接穿过命中点
ufomap_inflate_hits_dist: 0.1  # DUFOMap 的 d_s，沿射线扩展命中区域以容忍测距噪声
ufomap_down_sampling_method: uniform  # 可选 none、center、centroid、uniform
ufomap_simple_ray_casting: true  # false 使用 UFOMap proper ray casting
ufomap_simple_ray_casting_factor: 1.2  # simple ray casting 步长系数
ufomap_parallel: true  # 是否使用 UFOMap 并行积分
ufomap_propagate: true  # 是否在每帧插入后立即传播修改
ufomap_map_reserve_nodes: 200000  # 地图预分配节点数，0 表示不预分配
ufomap_accumulation_max_points: 120000  # DUFOMap 风格累计点云窗口，0 表示不限制点数
ufomap_clustering_enabled: false  # 是否启用 DUFOMap 风格 seen-free 动态候选 BFS 聚类
ufomap_clustering_max_distance: 0.2  # 聚类邻域半径，单位米
ufomap_clustering_min_points: 1  # 小于该点/节点数的簇会标为拒绝簇
ufomap_clustering_depth: 0  # 聚类查询深度，0 沿用 UFOMap Leaf 默认语义

